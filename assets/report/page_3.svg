<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <filter id="paperTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#fffdfa" surfaceScale="2">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feBlend mode="multiply" in="SourceGraphic" result="blend"/>
    </filter>
  </defs>

  <!-- Paper background -->
  <rect width="800" height="1100" fill="#fcfaf2"/>
  
  <!-- Notebook Lines -->
  <!-- Red margin line -->
  <line x1="70" y1="0" x2="70" y2="1100" stroke="#f87171" stroke-width="2"/>
  <line x1="74" y1="0" x2="74" y2="1100" stroke="#f87171" stroke-width="1" opacity="0.6"/>

  <!-- Horizontal blue ruling lines -->
  <g stroke="#93c5fd" stroke-width="1.2" opacity="0.6">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="192" x2="800" y2="192"/>
    <line x1="0" y1="234" x2="800" y2="234"/>
    <line x1="0" y1="276" x2="800" y2="276"/>
    <line x1="0" y1="318" x2="800" y2="318"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="0" y1="402" x2="800" y2="402"/>
    <line x1="0" y1="444" x2="800" y2="444"/>
    <line x1="0" y1="486" x2="800" y2="486"/>
    <line x1="0" y1="528" x2="800" y2="528"/>
    <line x1="0" y1="570" x2="800" y2="570"/>
    <line x1="0" y1="612" x2="800" y2="612"/>
    <line x1="0" y1="654" x2="800" y2="654"/>
    <line x1="0" y1="696" x2="800" y2="696"/>
    <line x1="0" y1="738" x2="800" y2="738"/>
    <line x1="0" y1="780" x2="800" y2="780"/>
    <line x1="0" y1="822" x2="800" y2="822"/>
    <line x1="0" y1="864" x2="800" y2="864"/>
    <line x1="0" y1="906" x2="800" y2="906"/>
    <line x1="0" y1="948" x2="800" y2="948"/>
    <line x1="0" y1="990" x2="800" y2="990"/>
    <line x1="0" y1="1032" x2="800" y2="1032"/>
  </g>

  <!-- Page Header -->
  <rect x="520" y="40" width="220" height="60" rx="8" fill="none" stroke="#2d6a4f" stroke-width="1.5"/>
  <text x="540" y="65" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#2d6a4f">Date: 2026-08-31</text>
  <text x="540" y="85" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#2d6a4f">Page No: 03</text>

  <!-- Document Title / Header -->
  <text x="90" y="100" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#0f4c3a">ENVIRONMENTAL STUDIES • CA1 RESEARCH REPORT</text>
  
  <!-- Handwritten Title -->
  <text x="90" y="190" font-family="'Caveat', 'Segoe Script', cursive" font-weight="700" font-size="34" fill="#0f172a">Section 3: 3. Description of Product & Attachments</text>
  <text x="90" y="230" font-family="'Caveat', 'Segoe Script', cursive" font-weight="600" font-size="22" fill="#334155">Primary Documentary & Presentation Showcase Hub</text>
  
  <line x1="90" y1="245" x2="730" y2="245" stroke="#0f4c3a" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Handwritten Lines -->
  <text x="90" y="300" font-family="'Caveat', 'Segoe Script', 'Comic Sans MS', cursive" font-size="24" fill="#1b2a4a">The primary product of this CA1 project is a Research-Based Educational Documentary.</text>
    <text x="90" y="345" font-family="'Caveat', 'Segoe Script', 'Comic Sans MS', cursive" font-size="24" fill="#1b2a4a">Documentary Title: Renewable Energy Transition in India: Challenges & Opportunities.</text>
    <text x="90" y="390" font-family="'Caveat', 'Segoe Script', 'Comic Sans MS', cursive" font-size="24" fill="#1b2a4a">Duration: ~12.5 minutes, divided into 8 structured interactive video chapters.</text>
    <text x="90" y="435" font-family="'Caveat', 'Segoe Script', 'Comic Sans MS', cursive" font-size="24" fill="#1b2a4a">Narrative flow: Energy Challenge -> RE Basics -> Progress -> Targets -> Solutions -> SDGs.</text>
    <text x="90" y="480" font-family="'Caveat', 'Segoe Script', 'Comic Sans MS', cursive" font-size="24" fill="#1b2a4a">Visual evidence includes high-definition motion graphics, maps, charts, and field footage.</text>
    <text x="90" y="525" font-family="'Caveat', 'Segoe Script', 'Comic Sans MS', cursive" font-size="24" fill="#1b2a4a">Attachments submitted: Storyboard, Scene Screenshots, Production Timeline, Poster, QR Code.</text>
    <text x="90" y="570" font-family="'Caveat', 'Segoe Script', 'Comic Sans MS', cursive" font-size="24" fill="#1b2a4a">The website acts as the interactive digital showcase hub connecting research to media.</text>
    <text x="90" y="615" font-family="'Caveat', 'Segoe Script', 'Comic Sans MS', cursive" font-size="24" fill="#1b2a4a">Audio commentary and voiceover were professionally edited to maximize educational clarity.</text>
    <text x="90" y="660" font-family="'Caveat', 'Segoe Script', 'Comic Sans MS', cursive" font-size="24" fill="#1b2a4a">Evaluators can scan the embedded QR code to stream the full video on YouTube.</text>

  <!-- Footer Watermark -->
  <rect x="90" y="1020" width="620" height="40" rx="5" fill="#e2e8f0" opacity="0.8"/>
  <text x="400" y="1045" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#475569" text-anchor="middle">Scanned CA1 Handwritten Submission • Environmental Studies</text>
</svg>