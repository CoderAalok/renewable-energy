<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" aria-label="Renewable Energy Transition India Logo">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="100%" stop-color="#062e1f" />
    </linearGradient>

    <!-- Sun Gradient -->
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Eco Leaf Gradient -->
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Transition Energy Swoosh Gradient -->
    <linearGradient id="energySwoosh" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="50" cy="50" r="47" fill="url(#bgGradient)" stroke="#10b981" stroke-width="2.5" />

  <!-- Outer Transition Ring Accent -->
  <circle cx="50" cy="50" r="43" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" stroke-dasharray="4 2" />

  <!-- Sun Rays & Sun (Solar Power) -->
  <g id="solar-element">
    <!-- Sun Core -->
    <circle cx="65" cy="33" r="12" fill="url(#sunGradient)" />
    <!-- Rays -->
    <line x1="65" y1="15" x2="65" y2="10" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="78" y1="20" x2="82" y2="16" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="83" y1="33" x2="88" y2="33" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="78" y1="46" x2="82" y2="50" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <line x1="52" y1="20" x2="48" y2="16" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Wind Turbine (Wind Power) -->
  <g id="wind-turbine">
    <!-- Mast -->
    <polygon points="37,46 41,46 42,78 36,78" fill="#e2e8f0" opacity="0.95" />
    <!-- Center Hub -->
    <circle cx="39" cy="46" r="3" fill="#ffffff" />
    <!-- Blade 1 (pointing up) -->
    <path d="M39,46 C37.5,34 38.5,20 39,18 C39.5,20 40.5,34 39,46 Z" fill="#ffffff" />
    <!-- Blade 2 (pointing lower-right) -->
    <path d="M39,46 C48,51 60,59 62,60 C60,61 47,51 39,46 Z" fill="#ffffff" />
    <!-- Blade 3 (pointing lower-left) -->
    <path d="M39,46 C30,51 18,59 16,60 C18,61 31,51 39,46 Z" fill="#ffffff" />
  </g>

  <!-- Green Ecological Leaf (Bio / Environment) -->
  <path d="M22,76 C20,60 30,50 48,52 C45,66 38,76 22,76 Z" fill="url(#leafGradient)" />
  <path d="M24,74 C32,68 38,62 44,55" stroke="#a7f3d0" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Hydro / Energy Flow Transition Wave (Dynamic Curve) -->
  <path d="M14,64 Q32,84 58,74 T86,66" fill="none" stroke="url(#energySwoosh)" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
</svg>
